<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frontline RTS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#eef5ff;font-family:system-ui,Arial;touch-action:none}
#top{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#0a1422;font-size:13px}
#game{display:block;width:100%;height:calc(100% - 108px);touch-action:none}
#panel{height:66px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:5px;background:#08111d}
button{border:1px solid #38506a;border-radius:8px;background:#192b40;color:#fff;font-weight:700;font-size:11px;padding:4px}
button.active{background:#9b7830;border-color:#ffe18a}
#hint{position:absolute;top:46px;left:8px;right:8px;font-size:11px;color:#c4d4e8;text-shadow:0 1px 2px #000;pointer-events:none}
</style>
</head>
<body>
<div id="top"><b>FRONTLINE RTS</b><span id="score">Синие 0 · Красные 0</span><button id="reset">Заново</button></div>
<div id="hint">Выбери свой отряд, затем коснись карты для приказа. Захватывай золотые объекты.</div>
<canvas id="game"></canvas>
<div id="panel">
<button data-order="MOVE" class="active">ДВИЖЕНИЕ</button>
<button data-order="ATTACK">АТАКА</button>
<button data-order="DEFEND">ОБОРОНА</button>
<button data-order="INF">+ ПЕХОТА</button>
<button data-order="TANK">+ ТАНК</button>
<button data-order="AIR">+ АЭРОДРОМ</button>
</div>
<script>
(()=> {
const cv=document.getElementById('game'),ctx=cv.getContext('2d'),score=document.getElementById('score');
let W=800,H=520, units=[],buildings=[],selected=null,order='MOVE',blueScore=0,redScore=0,last=0,camX=0,camY=0,drag=null;
const blue='#56aaff',red='#ff625b',gold='#f3c75a';
function reset(){
 units=[
 {x:150,y:160,tx:150,ty:160,t:0,k:'Танк',hp:100},{x:190,y:190,tx:190,ty:190,t:0,k:'Пехота',hp:100},
 {x:170,y:225,tx:170,ty:225,t:0,k:'Разведчик',hp:100},{x:620,y:380,tx:620,ty:380,t:1,k:'Танк',hp:100},
 {x:580,y:355,tx:580,ty:355,t:1,k:'Пехота',hp:100},{x:600,y:420,tx:600,ty:420,t:1,k:'Разведчик',hp:100}];
 buildings=[{x:120,y:120,k:'ШТАБ',t:0},{x:670,y:440,k:'ШТАБ',t:1},{x:250,y:280,k:'АЭРО',t:0},{x:550,y:300,k:'АЭРО',t:1},{x:360,y:190,k:'ОБЪЕКТ',t:-1},{x:420,y:390,k:'ОБЪЕКТ',t:-1}];
 selected=null;blueScore=0;redScore=0;camX=camY=0;score.textContent='Синие 0 · Красные 0';
}
function resize(){let dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr*r.width/800,0,0,dpr*r.height/520,0,0)}
function draw(){
 ctx.clearRect(0,0,800,520);ctx.fillStyle='#101e30';ctx.fillRect(0,0,800,520);
 ctx.save();ctx.translate(-camX,-camY);
 for(let x=0;x<840;x+=40)for(let y=0;y<560;y+=40){ctx.strokeStyle='#1d3045';ctx.strokeRect(x,y,40,40)}
 ctx.strokeStyle='#24484b';ctx.lineWidth=17;ctx.beginPath();ctx.moveTo(0,345);ctx.bezierCurveTo(180,270,270,440,430,340);ctx.bezierCurveTo(570,275,670,360,820,250);ctx.stroke();ctx.lineWidth=1;
 buildings.forEach(b=>{
 ctx.fillStyle=b.t===0?blue:b.t===1?red:gold;
 if(b.k==='ШТАБ'){ctx.fillRect(b.x-17,b.y-13,34,26);ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText('HQ',b.x-7,b.y+4)}
 else if(b.k==='АЭРО'){ctx.fillRect(b.x-22,b.y-5,44,10);ctx.strokeStyle=ctx.fillStyle;ctx.beginPath();ctx.moveTo(b.x-17,b.y-15);ctx.lineTo(b.x+17,b.y+15);ctx.moveTo(b.x+17,b.y-15);ctx.lineTo(b.x-17,b.y+15);ctx.stroke()}
 else{ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.fillStyle='#121a24';ctx.font='9px sans-serif';ctx.fillText('OBJ',b.x-9,b.y+3)}
 ctx.fillStyle='#dce8f8';ctx.font='10px sans-serif';ctx.fillText(b.t<0?'Нейтральная точка':b.t===0?'Синие':'Красные',b.x-30,b.y+28);
 });
 units.forEach(u=>{
 ctx.fillStyle=u.t===0?blue:red;
 if(u===selected){ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,19,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.tx,u.ty);ctx.stroke()}
 if(u.k==='Танк')ctx.fillRect(u.x-12,u.y-8,24,16);else if(u.k==='Пехота'){ctx.beginPath();ctx.arc(u.x,u.y,8,0,7);ctx.fill()}else{ctx.beginPath();ctx.moveTo(u.x,u.y-11);ctx.lineTo(u.x+9,u.y+8);ctx.lineTo(u.x-9,u.y+8);ctx.closePath();ctx.fill()}
 ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText(u.k+' '+u.hp,u.x-24,u.y-15);
 });ctx.restore();
}
function update(dt){
 units.forEach(u=>{let dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy);if(d>1){u.x+=dx/d*70*dt;u.y+=dy/d*70*dt}});
 if(Math.random()<dt*.7){
  units.filter(u=>u.t===1).forEach(u=>{let target=units.filter(v=>v.t===0).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];if(target&&Math.hypot(target.x-u.x,target.y-u.y)<90)target.hp-=3;else{u.tx=440+Math.random()*300;u.ty=160+Math.random()*300}});
  units.filter(u=>u.t===0).forEach(u=>{let target=units.filter(v=>v.t===1).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];if(target&&Math.hypot(target.x-u.x,target.y-u.y)<80)target.hp-=2});
  units=units.filter(u=>u.hp>0);
 }
 buildings.filter(b=>b.t===-1).forEach(b=>{let near=units.filter(u=>Math.hypot(u.x-b.x,u.y-b.y)<35);if(near.length){let t=near.reduce((a,u)=>a+ (u.t===0?1:-1),0);if(t){b.t=t>0?0:1;if(b.t===0)blueScore+=1;else redScore+=1;score.textContent=`Синие ${blueScore*100} · Красные ${redScore*100}`}}});
}
let prev=performance.now();function loop(now){let dt=Math.min((now-prev)/1000,.05);prev=now;update(dt);draw();requestAnimationFrame(loop)}
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*800+camX,y:(e.clientY-r.top)/r.height*520+camY}}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);let p=pos(e);drag={x:e.clientX,y:e.clientY,camX,camY,moved:false,start:p}});
cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>10)drag.moved=true;if(drag.moved){camX=Math.max(0,Math.min(120,drag.camX-dx/ cv.clientWidth*800));camY=Math.max(0,Math.min(25,drag.camY-dy/cv.clientHeight*520))}});
cv.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){let p=pos(e),hit=units.find(u=>Math.hypot(u.x-p.x,u.y-p.y)<22);if(hit&&hit.t===0)selected=hit;else if(selected){selected.tx=Math.max(10,Math.min(790,p.x));selected.ty=Math.max(10,Math.min(510,p.y));if(order==='ATTACK'){let enemy=units.filter(u=>u.t===1).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(enemy&&Math.hypot(enemy.x-p.x,enemy.y-p.y)<100)enemy.hp-=30}if(order==='DEFEND'){selected.tx=selected.x;selected.ty=selected.y}}}drag=null});
document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{let a=b.dataset.order;if(a==='INF'||a==='TANK'){units.push({x:150,y:250,tx:150,ty:250,t:0,k:a==='INF'?'Пехота':'Танк',hp:100})}else if(a==='AIR'){buildings.push({x:250+Math.random()*100,y:220+Math.random()*100,k:'АЭРО',t:0})}else order=a;document.querySelectorAll('[data-order]').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('reset').onclick=reset;window.addEventListener('resize',resize);reset();resize();requestAnimationFrame(loop);
})();
</script>
</body></html>
